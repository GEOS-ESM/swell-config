# Override for:
#   swell create hofx_cf -o override_hofx.yaml --store-r2d2
#

experiment_id: training_ops_cf_hofx

# In R2D2, feedback files will be saved 
# under "r2d2_experiment_id_random_hexadecimal"

r2d2_experiment_id: training_ops_cf_hofx

start_cycle_point: '2025-10-10T12:00:00Z'
final_cycle_point: '2025-10-10T18:00:00Z'

model_components:
  - geos_cf

models:
  geos_cf:
    check_for_obs: false
    window_length: PT6H
    window_type: 4D
    background_frequency: PT1H
    jedi_forecast_model: pseudo_model

    # Must match the background ingest override above.
    background_experiment: geos_cf_oper
    horizontal_resolution: c360
    vertical_resolution: 72
    npx: 361
    npy: 361

    # Match the observations ingested by override_obs.yaml.
    observations:
      - tempo_no2_tropo

    observation_providers:
      tempo_no2_tropo: nasa_v4
