# Override for:
#   swell create 3dvar_cf_cycle -o /Users/jbarre/swell-config/geos_cf/3dvar_cf_cycle.yaml --store-r2d2

experiment_id: geos_cf_3dvar_cycle
r2d2_experiment_id: geos_cf_3dvar_cycle

# Four 6-hour windows in one day: 00Z, 06Z, 12Z, 18Z.
start_cycle_point: '2025-04-02T06:00:00Z'
final_cycle_point: '2025-04-03T06:00:00Z'

model_components:
  - geos_cf

models:
  geos_cf:
    window_length: PT6H
    window_type: 3D
    forecast_output_frequency: PT1H

    # Inner-loop iterations
    number_of_iterations: 100
    gradient_norm_reduction: 1e-6

    # Control variables in the CV.
    analysis_variables:
      - volume_mixing_ratio_of_o3
      - volume_mixing_ratio_of_no2
      - volume_mixing_ratio_of_co

    # Observations to include in the cost function.
    observations:
      - omps_o3_nm_total
      - tropomi_s5p_no2_tropo
      - tropomi_s5p_co_total

    # B-matrix StdDev outer-block scaling coefficient.
    stddev_scale_factor: '0.20'
