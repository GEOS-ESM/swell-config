# Override for:
#   swell create 3dvar_cf -o 3dvar_cfv3.yaml
#

#   swell create 3dvar_cf_cycle -o /Users/jbarre/swell-config/geos_cf/3dvar_cf_cycle.yaml

experiment_id: cfv3_3dvar_cycle

r2d2_experiment_id: cfv3_3dvar_cycle
r2d2_server: cfdev_server

existing_jedi_build_directory: /discover/nobackup/jbarre/geosdev/jedi-bundle-test/build/

# Four 6-hour windows in one day: 00Z, 06Z, 12Z, 18Z.
start_cycle_point: '2025-04-02T06:00:00Z'
final_cycle_point: '2025-04-03T06:00:00Z'

model_components:
  - geos_cf

models:
  geos_cf:
    window_length: PT6H
    window_type: 3D
    forecast_output_frequency: PT1H
    # Optional lat-lon history collections written and stored in R2D2 in addition to the
    # always-written 'bkg' collection. Options: chm, met. Use [] to write only 'bkg'.
    additional_forecast_collections:
      - chm
      - met
    background_experiment: cf2_c90_nm_bkg_test
    rst_experiment: cf2_c90_nm_bkg_test

    number_of_iterations:
      - 100
    gradient_norm_reduction: 1e-6

    analysis_variables:
      - volume_mixing_ratio_of_o3
      - volume_mixing_ratio_of_no2
      - volume_mixing_ratio_of_co

    saber_central_block: bump_nicas
    saber_outer_block: stddev_bkg_scaled
    # Override the BUMP/NICAS localization files used by the bump_nicas central block
    # (defaults: cycle_dir, 'geos_cf', 'fixedlevel_H_500_300_V_00_03').
    bump_nicas_data_directory: /discover/nobackup/jbarre/geosdev/standalone_jedi/outputs/bump_cf_v3_n24
    bump_nicas_files_prefix: geos_cf_v3
    bump_nicas_group_name: fixedlevel_H_1600_850_V_00_03
    stddev_scale_factors:
      volume_mixing_ratio_of_o3: 0.05
      volume_mixing_ratio_of_co: 0.3
      volume_mixing_ratio_of_no2: 0.2

    observations:
      - mls_o3_nrt
      - omps_o3_nm_total
      - tropomi_s5p_no2_tropo
      - tropomi_s5p_co_total
