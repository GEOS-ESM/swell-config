# Override for:
#   swell create ingest_obs_cf -o <thisyaml>.yaml
#
# This downloads, converts, and ingests the observation for cfv3

experiment_id: ingest_obs_cfv3

start_cycle_point: '2025-03-31T18:00:00Z'
final_cycle_point: '2025-04-15T18:00:00Z'

model_components:
  - geos_cf

download_convert_pipeline: true

r2d2_server: cfdev_server

models:
  geos_cf:
    window_length: PT6H

    obs_to_download:
      - mls_o3_nrt
      - omps_o3_nm_total
      - tropomi_s5p_no2_tropo
      - tropomi_s5p_co_total
    obs_to_ingest:
      - mls_o3_nrt
      - omps_o3_nm_total
      - tropomi_s5p_no2_tropo
      - tropomi_s5p_co_total

    # Directory containing ioda-converter scripts.
    converter_path: /discover/nobackup/jbarre/geosdev/jedi-bundle-test/build/bin

    download_obs_config_overrides:
      mls_o3_nrt:
        retrieval_method: local
        local_file_template: /discover/nobackup/projects/gmao/geos_cf_dev/GEOS-CF3-dev/MLS_nrt/Y%Y/M%m/MLS-Aura_L2GP-O3_v05-*-NRT-*-c01_%Yd%jt*.he5
      tropomi_s5p_no2_tropo:
        retrieval_method: s3_public
        s3_source: s3://meeo-s5p/OFFL/L2__NO2___/YYYY/MM/DD
      tropomi_s5p_co_total:
        retrieval_method: s3_public
        s3_source: s3://meeo-s5p/OFFL/L2__CO____/YYYY/MM/DD      


    # Set true for training/preview. Set false for operational R2D2 writes.
    dry_run: false
    store_as_symlink: false
